name: wallet

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: postgres
  WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:-wallet_owner}
  WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:-wallet_app}

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d wallet"]
  interval: 2s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:17-alpine
    environment: *postgres-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck: *postgres-healthcheck

  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://wallet_owner:${WALLET_OWNER_PASSWORD:-wallet_owner}@postgres:5432/wallet?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres_test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment: *postgres-env
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck: *postgres-healthcheck

  migrate_test:
    image: migrate/migrate:v4.20.1
    profiles: ["test"]
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://wallet_owner:${WALLET_OWNER_PASSWORD:-wallet_owner}@postgres_test:5432/wallet?sslmode=disable
      - up
    depends_on:
      postgres_test:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck: &keycloak-healthcheck
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  keycloak_test:
    image: quay.io/keycloak/keycloak:26.6
    profiles: ["test"]
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:${KEYCLOAK_TEST_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_TEST_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck: *keycloak-healthcheck

  ministack:
    image: ministackorg/ministack:1.5.20
    environment:
      AUTH: "true"
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    healthcheck: &ministack-healthcheck
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_ministack/health', timeout=3)\""]
      interval: 3s
      timeout: 5s
      retries: 40

  ministack_init:
    image: amazon/aws-cli:2.37.8
    depends_on:
      ministack:
        condition: service_healthy
    entrypoint: ["bash", "/provision/provision.sh"]
    environment:
      MINISTACK_ENDPOINT: http://ministack:4566
      CREDENTIALS_OUT: /out/credentials
    volumes:
      - ./deploy/ministack:/provision:ro
      - ./.local/ministack:/out

  ministack_test:
    image: ministackorg/ministack:1.5.20
    profiles: ["test"]
    environment:
      AUTH: "true"
    ports:
      - "${MINISTACK_TEST_PORT:-4567}:4566"
    networks:
      default:
        aliases: [ministack-test] # the aws cli rejects underscores in hostnames
    healthcheck: *ministack-healthcheck

  ministack_test_init:
    image: amazon/aws-cli:2.37.8
    profiles: ["test"]
    depends_on:
      ministack_test:
        condition: service_healthy
    entrypoint: ["bash", "/provision/provision.sh"]
    environment:
      MINISTACK_ENDPOINT: http://ministack-test:4566
      CREDENTIALS_OUT: /out/credentials
    volumes:
      - ./deploy/ministack:/provision:ro
      - ./.local/ministack-test:/out

  wallet:
    build: .
    image: wallet:local
    deploy:
      replicas: 3
    environment:
      DATABASE_URL: postgres://wallet_app:${WALLET_APP_PASSWORD:-wallet_app}@postgres:5432/wallet?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8080}/realms/wallet
      OIDC_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
      AWS_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /run/ministack/credentials
      SQS_ENDPOINT: http://ministack:4566
      SQS_CONSUMER_PROFILE: wallet-consumer
      SQS_PUBLISHER_PROFILE: wallet-publisher
    volumes:
      - ./.local/ministack:/run/ministack:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      ministack_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    # composition.StopTimeout with every toggle on is 77s.
    stop_grace_period: 90s

  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "${WALLET_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      wallet:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      wallet:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wallet.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
